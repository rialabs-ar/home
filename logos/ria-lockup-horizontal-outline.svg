<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 180" width="640" height="180">
  <defs>
    <style>
      .ria-h-o  { font-family: 'Saira', 'Helvetica Neue', Arial, sans-serif; font-weight: 500; font-size: 118px; letter-spacing: 9px; fill: none; stroke: currentColor; stroke-width: 1.3; paint-order: stroke; }
      .labs-h-o { font-family: 'Saira', 'Helvetica Neue', Arial, sans-serif; font-weight: 300; font-size: 50px;  letter-spacing: 4px; fill: none; stroke: currentColor; stroke-width: 0.8; paint-order: stroke; }
    </style>
  </defs>

  <!-- Eclipse on the left -->
  <g transform="translate(100 90)">
    <circle r="54" fill="none" stroke="currentColor" stroke-width="1.8"/>
    <circle r="45" fill="none" stroke="currentColor" stroke-width="1.8"/>
  </g>

  <!-- Wordmark on the right -->
  <text class="ria-h-o"  x="200" y="128">RIA</text>
  <text class="labs-h-o" x="478" y="92">Labs</text>
</svg>
