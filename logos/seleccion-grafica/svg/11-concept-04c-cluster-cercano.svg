<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 280" width="280" height="280">
  <defs>
    <radialGradient id="c4c-vrio" cx="33%" cy="28%" r="68%">
      <stop offset="0%"   stop-color="#f8d888"/>
      <stop offset="38%"  stop-color="#EF9F27"/>
      <stop offset="100%" stop-color="#4a2800"/>
    </radialGradient>
    <radialGradient id="c4c-byte" cx="33%" cy="28%" r="68%">
      <stop offset="0%"   stop-color="#b8ddf8"/>
      <stop offset="38%"  stop-color="#4a8fd4"/>
      <stop offset="100%" stop-color="#051628"/>
    </radialGradient>
    <radialGradient id="c4c-corona" cx="50%" cy="50%" r="50%">
      <stop offset="58%" stop-color="#EF9F27" stop-opacity="0"/>
      <stop offset="78%" stop-color="#EF9F27" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#EF9F27" stop-opacity="0"/>
    </radialGradient>
    <filter id="c4c-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Byte (más cerca del eclipse) -->
  <circle cx="75" cy="75" r="26" fill="url(#c4c-byte)"/>

  <!-- Eclipse -->
  <g transform="translate(140 140)">
    <circle r="60" fill="url(#c4c-corona)"/>
    <circle r="50" fill="none" stroke="#c8860a" stroke-width="5.5" opacity="0.85" filter="url(#c4c-glow)"/>
    <circle r="50" fill="none" stroke="#EF9F27" stroke-width="2.2" opacity="0.95"/>
    <circle r="44" fill="#07060f"/>
  </g>

  <!-- VRIO (más cerca del eclipse) -->
  <circle cx="205" cy="205" r="26" fill="url(#c4c-vrio)"/>
</svg>
