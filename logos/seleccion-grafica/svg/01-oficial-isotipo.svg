<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="corona" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#EF9F27" stop-opacity="0"/>
      <stop offset="58%"  stop-color="#EF9F27" stop-opacity="0"/>
      <stop offset="78%"  stop-color="#EF9F27" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#EF9F27" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Corona atmosphere -->
  <circle cx="50" cy="50" r="48" fill="url(#corona)"/>
  <!-- Outer halos (warm stack) -->
  <circle cx="50" cy="50" r="44" fill="none" stroke="#633806" stroke-width="2.2" opacity="0.28"/>
  <circle cx="50" cy="50" r="41" fill="none" stroke="#854F0B" stroke-width="1.4" opacity="0.32"/>
  <!-- Bright corona ring -->
  <circle cx="50" cy="50" r="38" fill="none" stroke="#c8860a" stroke-width="5" opacity="0.85" filter="url(#glow)"/>
  <circle cx="50" cy="50" r="38" fill="none" stroke="#EF9F27" stroke-width="2.2" opacity="0.95"/>
  <!-- Inner limb hint -->
  <circle cx="50" cy="50" r="34" fill="none" stroke="#c8860a" stroke-width="0.8" opacity="0.5"/>
  <!-- Dark moon disc — total eclipse -->
  <circle cx="50" cy="50" r="32" fill="#07060f"/>
</svg>
