<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="900" height="320">
  <defs>
    <style>
      .bg { fill: #0a0814; }
      .label { font-family: 'Saira', 'Helvetica Neue', Arial, sans-serif; font-weight: 500; fill: #EF9F27; font-size: 13px; letter-spacing: 2.5px; text-transform: uppercase; }
      .sub   { font-family: 'Saira', 'Helvetica Neue', Arial, sans-serif; font-weight: 300; fill: rgba(240,236,224,0.55); font-size: 12px; letter-spacing: 1px; }
      .ria   { font-family: 'Saira', 'Helvetica Neue', Arial, sans-serif; font-weight: 500; fill: #f0ece0; font-size: 32px; letter-spacing: 4.5px; }
      .labs  { font-family: 'Saira', 'Helvetica Neue', Arial, sans-serif; font-weight: 300; fill: #EF9F27; font-size: 20px; letter-spacing: 2px; }
      .divider { stroke: rgba(239,159,39,0.2); stroke-width: 1; }
      .panel   { fill: #0d0b1a; stroke: rgba(239,159,39,0.12); stroke-width: 1; rx: 10; }
    </style>

    <!-- ANTES · 50% · original -->
    <symbol id="iso-before" viewBox="0 0 24 24">
      <circle cx="12" cy="14" r="10"  fill="none" stroke="#2a1200" stroke-width="5" opacity="0.65"/>
      <circle cx="12" cy="14" r="9.5" fill="none" stroke="#412402" stroke-width="3" opacity="0.5"/>
      <circle cx="12" cy="14" r="9"   fill="none" stroke="#633806" stroke-width="1.5" opacity="0.35"/>
      <circle cx="12" cy="14" r="8.5" fill="none" stroke="#BA7517" stroke-width="0.7" opacity="0.22"/>
      <circle cx="12" cy="14" r="8"   fill="#1c1810"/>
      <circle cx="12" cy="10" r="8"   fill="#0b0a14"/>
    </symbol>

    <!-- DESPUÉS · 30% · nuevo -->
    <symbol id="iso-after" viewBox="0 0 24 24">
      <circle cx="12" cy="13.2" r="10"  fill="none" stroke="#2a1200" stroke-width="5" opacity="0.65"/>
      <circle cx="12" cy="13.2" r="9.5" fill="none" stroke="#412402" stroke-width="3" opacity="0.5"/>
      <circle cx="12" cy="13.2" r="9"   fill="none" stroke="#633806" stroke-width="1.5" opacity="0.35"/>
      <circle cx="12" cy="13.2" r="8.5" fill="none" stroke="#BA7517" stroke-width="0.7" opacity="0.22"/>
      <circle cx="12" cy="13.2" r="8"   fill="#1c1810"/>
      <circle cx="12" cy="10.8" r="8"   fill="#0b0a14"/>
    </symbol>
  </defs>

  <rect class="bg" width="900" height="320"/>

  <!-- Título -->
  <text class="label" x="40" y="40">Nav-logo · antes y después</text>
  <text class="sub"   x="40" y="60">contexto real del header (ancho completo del wordmark &quot;RIA Labs&quot;)</text>

  <!-- ============ ANTES ============ -->
  <rect class="panel" x="40" y="90" width="400" height="160" rx="10"/>
  <text class="label" x="60" y="120" style="font-size:11px;letter-spacing:2px">Antes · 50% ↑</text>

  <!-- Nav fake: iso + wordmark -->
  <g transform="translate(60, 150)">
    <svg x="0" y="-20" width="56" height="56" viewBox="0 0 24 24">
      <use href="#iso-before"/>
    </svg>
    <text class="ria"  x="70" y="10">RIA</text>
    <text class="labs" x="160" y="10">Labs</text>
  </g>

  <text class="sub" x="60" y="220" style="font-family:SF Mono, monospace;font-size:11px">cy_corona=14   cy_luna=10   Δ=4 (50%)</text>

  <!-- flecha -->
  <g transform="translate(460, 160)">
    <line x1="0" y1="10" x2="20" y2="10" stroke="#EF9F27" stroke-width="2"/>
    <polygon points="20,4 30,10 20,16" fill="#EF9F27"/>
  </g>

  <!-- ============ DESPUÉS ============ -->
  <rect class="panel" x="500" y="90" width="400" height="160" rx="10" stroke="rgba(239,159,39,0.32)" stroke-width="1.5"/>
  <text class="label" x="520" y="120" style="font-size:11px;letter-spacing:2px">Después · 30% ↑</text>

  <g transform="translate(520, 150)">
    <svg x="0" y="-20" width="56" height="56" viewBox="0 0 24 24">
      <use href="#iso-after"/>
    </svg>
    <text class="ria"  x="70" y="10">RIA</text>
    <text class="labs" x="160" y="10">Labs</text>
  </g>

  <text class="sub" x="520" y="220" style="font-family:SF Mono, monospace;font-size:11px">cy_corona=13.2   cy_luna=10.8   Δ=2.4 (30%)</text>

  <!-- ============ Nota ============ -->
  <text class="sub" x="40" y="290">El cambio preserva el centroide en (12, 12) · la luna se acerca más al centro de la corona · lectura más "eclipse con aura cálida" y menos "creciente".</text>
</svg>
