<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 620" width="1300" height="620">
  <defs>
    <style>
      .bg     { fill: #0a0814; }
      .title  { font-family: 'Saira', 'Helvetica Neue', Arial, sans-serif; font-weight: 500; fill: #EF9F27; font-size: 15px; letter-spacing: 3px; text-transform: uppercase; }
      .sub    { font-family: 'Saira', 'Helvetica Neue', Arial, sans-serif; font-weight: 300; fill: rgba(240,236,224,0.55); font-size: 12px; letter-spacing: 0.6px; }
      .frame-label { font-family: 'Saira', 'Helvetica Neue', Arial, sans-serif; font-weight: 400; fill: #f0ece0; font-size: 13px; letter-spacing: 1.5px; text-transform: uppercase; text-anchor: middle; }
      .delta  { font-family: 'SF Mono', Menlo, monospace; fill: #EF9F27; font-size: 11px; text-anchor: middle; }
      .delta-total { fill: #f8d888; font-weight: 700; }
      .panel  { fill: #0d0b1a; stroke: rgba(239,159,39,0.14); stroke-width: 1; }
      .panel.highlight { stroke: rgba(239,159,39,0.35); stroke-width: 1.5; }
      .divider { stroke: rgba(239,159,39,0.14); stroke-width: 1; }
    </style>

    <!-- Corona stack compartida -->
    <g id="corona">
      <circle cx="60" cy="68" r="52" fill="none" stroke="#1a0900" stroke-width="22" opacity="0.55"/>
      <circle cx="60" cy="68" r="50" fill="none" stroke="#2a1200" stroke-width="14" opacity="0.42"/>
      <circle cx="60" cy="68" r="48" fill="none" stroke="#3d1c00" stroke-width="9"  opacity="0.32"/>
      <circle cx="60" cy="68" r="46" fill="none" stroke="#633806" stroke-width="5"  opacity="0.24"/>
      <circle cx="60" cy="68" r="45" fill="none" stroke="#854F0B" stroke-width="2.5" opacity="0.18"/>
      <circle cx="60" cy="68" r="44" fill="none" stroke="#BA7517" stroke-width="1.2" opacity="0.13"/>
      <circle cx="60" cy="68" r="38" fill="#1c1810"/>
    </g>

    <!-- Keyframes ANTES (animación original) -->
    <symbol id="kf-old-top"    viewBox="0 0 120 120"><use href="#corona"/><circle cx="60" cy="56" r="38" fill="#0b0a14"/></symbol>
    <symbol id="kf-old-right"  viewBox="0 0 120 120"><use href="#corona"/><circle cx="67" cy="61" r="38" fill="#0b0a14"/></symbol>
    <symbol id="kf-old-bottom" viewBox="0 0 120 120"><use href="#corona"/><circle cx="60" cy="66" r="38" fill="#0b0a14"/></symbol>
    <symbol id="kf-old-left"   viewBox="0 0 120 120"><use href="#corona"/><circle cx="53" cy="61" r="38" fill="#0b0a14"/></symbol>

    <!-- Keyframes DESPUÉS (animación nueva) -->
    <symbol id="kf-new-top"    viewBox="0 0 120 120"><use href="#corona"/><circle cx="60" cy="58" r="38" fill="#0b0a14"/></symbol>
    <symbol id="kf-new-right"  viewBox="0 0 120 120"><use href="#corona"/><circle cx="65" cy="63" r="38" fill="#0b0a14"/></symbol>
    <symbol id="kf-new-bottom" viewBox="0 0 120 120"><use href="#corona"/><circle cx="60" cy="68" r="38" fill="#0b0a14"/></symbol>
    <symbol id="kf-new-left"   viewBox="0 0 120 120"><use href="#corona"/><circle cx="55" cy="63" r="38" fill="#0b0a14"/></symbol>
  </defs>

  <rect class="bg" width="1300" height="620"/>

  <text class="title" x="40" y="40">Animación del hero · keyframes antes y después</text>
  <text class="sub"   x="40" y="62">los 4 puntos cardinales del barrido orbital de la luna (duración 16s, spline easing, corona fija en cy=68)</text>

  <!-- ============ ANTES ============ -->
  <rect class="panel" x="40" y="90" width="1220" height="220" rx="10"/>
  <text class="title" x="62" y="122" style="font-size:12px;letter-spacing:2px">Antes · elipse 7×5 alrededor de (60, 61) · máx 32% · mín 5%</text>

  <g transform="translate(60, 150)">
    <!-- TOP t=0 -->
    <svg x="0" y="0" width="140" height="140" viewBox="0 0 120 120"><use href="#kf-old-top"/></svg>
    <text class="frame-label" x="70" y="160">t = 0 · top</text>
    <text class="delta" x="70" y="180">Δ = 12 · 32% ↑</text>

    <!-- RIGHT t=0.25 -->
    <svg x="280" y="0" width="140" height="140" viewBox="0 0 120 120"><use href="#kf-old-right"/></svg>
    <text class="frame-label" x="350" y="160">t = 0.25 · right</text>
    <text class="delta" x="350" y="180">Δ = 10 · 25%</text>

    <!-- BOTTOM t=0.5 -->
    <svg x="560" y="0" width="140" height="140" viewBox="0 0 120 120"><use href="#kf-old-bottom"/></svg>
    <text class="frame-label" x="630" y="160">t = 0.5 · bottom</text>
    <text class="delta" x="630" y="180">Δ = 2 · 5% ↑</text>
    <text class="sub" x="630" y="196" style="text-anchor:middle;font-size:10px">casi total, no del todo</text>

    <!-- LEFT t=0.75 -->
    <svg x="840" y="0" width="140" height="140" viewBox="0 0 120 120"><use href="#kf-old-left"/></svg>
    <text class="frame-label" x="910" y="160">t = 0.75 · left</text>
    <text class="delta" x="910" y="180">Δ = 10 · 25%</text>

    <!-- Specs -->
    <text class="sub" x="1060" y="40" style="font-family:SF Mono,monospace;font-size:10px">cx: 60;67;60;53;60</text>
    <text class="sub" x="1060" y="56" style="font-family:SF Mono,monospace;font-size:10px">cy: 56;61;66;61;56</text>
    <text class="sub" x="1060" y="82" style="font-size:11px">órbita elíptica</text>
    <text class="sub" x="1060" y="98" style="font-size:11px">centro (60, 61) · radio 7×5</text>
    <text class="sub" x="1060" y="124" style="font-size:11px">rango Δ: 2 — 12</text>
    <text class="sub" x="1060" y="140" style="font-size:11px">rango %: 5% — 32%</text>
  </g>

  <!-- flecha ↓ -->
  <g transform="translate(640, 340)">
    <line x1="0" y1="0" x2="0" y2="24" stroke="#EF9F27" stroke-width="2"/>
    <polygon points="-6,24 6,24 0,34" fill="#EF9F27"/>
  </g>

  <!-- ============ DESPUÉS ============ -->
  <rect class="panel highlight" x="40" y="390" width="1220" height="220" rx="10"/>
  <text class="title" x="62" y="422" style="font-size:12px;letter-spacing:2px;fill:#f8d888">Después · círculo radio 5 alrededor de (60, 63) · máx 26% · mín 0% ✓ eclipse total</text>

  <g transform="translate(60, 450)">
    <!-- TOP t=0 -->
    <svg x="0" y="0" width="140" height="140" viewBox="0 0 120 120"><use href="#kf-new-top"/></svg>
    <text class="frame-label" x="70" y="160">t = 0 · top</text>
    <text class="delta" x="70" y="180">Δ = 10 · 26% ↑</text>

    <!-- RIGHT t=0.25 -->
    <svg x="280" y="0" width="140" height="140" viewBox="0 0 120 120"><use href="#kf-new-right"/></svg>
    <text class="frame-label" x="350" y="160">t = 0.25 · right</text>
    <text class="delta" x="350" y="180">Δ = 7 · 18%</text>

    <!-- BOTTOM t=0.5 ← TOTAL -->
    <svg x="560" y="0" width="140" height="140" viewBox="0 0 120 120"><use href="#kf-new-bottom"/></svg>
    <text class="frame-label" x="630" y="160" style="fill:#f8d888">t = 0.5 · total ✦</text>
    <text class="delta delta-total" x="630" y="180">Δ = 0 · ECLIPSE TOTAL</text>

    <!-- LEFT t=0.75 -->
    <svg x="840" y="0" width="140" height="140" viewBox="0 0 120 120"><use href="#kf-new-left"/></svg>
    <text class="frame-label" x="910" y="160">t = 0.75 · left</text>
    <text class="delta" x="910" y="180">Δ = 7 · 18%</text>

    <!-- Specs -->
    <text class="sub" x="1060" y="40" style="font-family:SF Mono,monospace;font-size:10px">cx: 60;65;60;55;60</text>
    <text class="sub" x="1060" y="56" style="font-family:SF Mono,monospace;font-size:10px">cy: 58;63;68;63;58</text>
    <text class="sub" x="1060" y="82" style="font-size:11px">órbita circular</text>
    <text class="sub" x="1060" y="98" style="font-size:11px">centro (60, 63) · radio 5</text>
    <text class="sub" x="1060" y="124" style="font-size:11px">rango Δ: 0 — 10</text>
    <text class="sub" x="1060" y="140" style="font-size:11px;fill:#EF9F27">rango %: 0% — 26%</text>
  </g>
</svg>
