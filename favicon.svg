<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="corona-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#EF9F27" stop-opacity="0.0"/>
      <stop offset="58%"  stop-color="#EF9F27" stop-opacity="0.0"/>
      <stop offset="78%"  stop-color="#EF9F27" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#EF9F27" stop-opacity="0.0"/>
    </radialGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Corona atmosphere glow -->
  <circle cx="50" cy="50" r="48" fill="url(#corona-glow)"/>

  <!-- Corona ring — glowing gold -->
  <circle cx="50" cy="50" r="38" fill="none" stroke="#EF9F27" stroke-width="4.5" opacity="0.92" filter="url(#glow)"/>

  <!-- Inner limb hint -->
  <circle cx="50" cy="50" r="34" fill="none" stroke="#c8860a" stroke-width="0.8" opacity="0.4"/>

  <!-- Dark moon disc — centered, eclipse total -->
  <circle cx="50" cy="50" r="32" fill="#07060f"/>
</svg>
