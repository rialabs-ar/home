<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="glowOuter" cx="42%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#F5A623" stop-opacity="0.0"/>
      <stop offset="60%" stop-color="#E8820A" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#C96A00" stop-opacity="0.9"/>
    </radialGradient>
    <radialGradient id="innerDark" cx="54%" cy="54%" r="50%">
      <stop offset="0%" stop-color="#0D0D14"/>
      <stop offset="100%" stop-color="#050508"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Outer glow ring -->
  <circle cx="50" cy="50" r="42" fill="none" stroke="#D97B0A" stroke-width="7" opacity="0.25" filter="url(#glow)"/>

  <!-- Main ring (the eclipse ring) -->
  <circle cx="50" cy="50" r="38" fill="none" stroke="#E8920C" stroke-width="5.5" opacity="0.9" filter="url(#glow)"/>

  <!-- Dark inner circle (the "moon" occulting) -->
  <circle cx="53" cy="47" r="34" fill="#0A0A12"/>

  <!-- Crescent highlight - the visible arc of the ring -->
  <path d="M 18,42 A 34,34 0 0,1 52,14" fill="none" stroke="#F5A623" stroke-width="6" stroke-linecap="round" opacity="0.95" filter="url(#glow)"/>
  <path d="M 18,42 A 34,34 0 0,1 52,14" fill="none" stroke="#FFD080" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
</svg>
