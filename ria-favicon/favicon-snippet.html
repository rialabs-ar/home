<!-- =============================================
     RIA Labs — Favicon Implementation Snippet
     Pegar dentro del <head> en V1, V2 y V3
     ============================================= -->

<!-- Favicon estándar (navegadores de escritorio) -->
<link rel="icon" type="image/x-icon" href="/favicon.ico">

<!-- Favicon PNG para navegadores modernos -->
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png">

<!-- Apple Touch Icon (iOS / Safari) -->
<link rel="apple-touch-icon" sizes="180x180" href="/favicon-180x180.png">

<!-- SVG (navegadores modernos que lo soporten) -->
<link rel="icon" type="image/svg+xml" href="/favicon.svg">

<!-- Meta para color del tema (opcional, combina con el branding oscuro de RIA) -->
<meta name="theme-color" content="#0A0A12">
